[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-ops"
version = "2.2.0"
description = "Blue Data Operators — self-contained operator library"
readme = "README.md"
requires-python = ">=3.10"
# Pydantic provides lax attribute-type validation. blue-data provides the registry
# integration behind blue_data_ops/data/, the package's only blue-data import boundary.
# jsonmerge==1.9.2 backs the Blue-compatible merge_json; jsonpath-ng is imported
# directly (llm.templating, utils.json_utils) so it is declared directly rather than
# relied on transitively through blue-data.
# tenacity is core rather than part of the llm extra because llm/client.py imports it at
# module scope, and two eager paths reach that module from the package root: utils/ through
# string_utils, and operators/ through the nine LLM-backed operator modules. With tenacity
# in the extra, `pip install blue-data-ops` produced a package that could not be imported
# at all. It is the only member of that extra imported at import time; litellm, diskcache,
# and jinja2 are all reached inside function bodies and stay optional.
dependencies = [
    "blue-data>=0.1.0",
    "pydantic>=2",
    "jsonmerge==1.9.2",
    "jsonpath-ng",
    "tenacity",
]

[project.optional-dependencies]
ml = ["numpy", "scikit-learn"]
vector = ["numpy", "sentence-transformers"]
llm = ["litellm", "tenacity", "diskcache", "jinja2"]
# Planner-only OpenAI SDK seam. Upper-bounded at 3 deliberately: 2.x is the audited
# httpx transport and Responses surface, and 3.x moves to HTTPX2. Revisit the major
# in a separately tested dependency update.
openai = ["openai>=2.54,<3"]
dev = [
    "numpy",
    "scikit-learn",
    "tenacity",
    "diskcache",
    "jinja2",
    "openai>=2.54,<3",
    "pytest",
    "pytest-asyncio",
    "pytest-recording",
    "pytest-cov",
    "ruff",
    "pyright",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_ops = [
    "py.typed",
    "plan/_schemas/*.json",
    "operator_skills/_index.json",
    "operator_skills/*/*/*.json",
    "operator_skills/*/*/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are protocol text whose exact bytes affect provider requests;
# keep their line content unchanged while enforcing E501 everywhere else.
"src/blue_data_ops/operators/nl2llm_operator.py" = ["E501"]
"src/blue_data_ops/operators/nl2bn_operator.py" = ["E501"]
"src/blue_data_ops/operators/nl2sql_operator.py" = ["E501"]
"src/blue_data_ops/operators/semantic_extract_operator.py" = ["E501"]
"src/blue_data_ops/operators/semantic_filter_operator.py" = ["E501"]
"src/blue_data_ops/operators/semantic_join_operator.py" = ["E501"]
"src/blue_data_ops/operators/semantic_project_operator.py" = ["E501"]
"src/blue_data_ops/operators/semantic_transform_operator.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# tests/stubs holds deterministic fakes for optional heavy deps (litellm,
# sentence-transformers); pyright resolves them for analysis, pytest via conftest.
extraPaths = ["tests/stubs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
