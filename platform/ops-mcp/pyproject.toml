[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-ops-mcp"
version = "1.0.0"
description = "MCP adapter for Blue Data Operators"
readme = "README.md"
requires-python = ">=3.11"
# The core pin is exact and names the core release this adapter was verified against.
dependencies = [
    "blue-data-ops==3.1.0",
    "mcp>=1.28.1,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "build",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "twine",
]

[project.scripts]
blue-data-ops-mcp = "blue_data_ops_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_ops_mcp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# The same two roots pytest puts on the path below. Without them every import from the
# library resolves to Unknown and strict mode checks far less than it reports.
extraPaths = ["src", "../../lib/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../../lib/src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
