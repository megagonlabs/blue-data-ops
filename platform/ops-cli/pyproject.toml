[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-ops-cli"
version = "1.0.0"
description = "Command line interface for Blue Data Operators"
readme = "README.md"
license = "LicenseRef-BlueData"
license-files = ["LICENSE", "NOTICE"]
# The core floor, not the family's. Lowering it is a verification obligation on an
# interpreter this repository does not test; see design/05-software-stack.md.
requires-python = ">=3.12,<3.14"
# The core pin is exact and names the core release this adapter was verified against,
# the same rule platform/ops-mcp follows. The three extras are the ones the active
# operators need to load: ml, vector and llm.
dependencies = [
    "blue-data-ops[ml,vector,llm]==1.0.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["blue-data-ops[openai]==1.0.0"]
dev = [
    "build",
    "pyright==1.1.414",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff==0.17.3",
    "twine",
]

[project.scripts]
blue-ops = "blue_data_ops_cli.commands:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_ops_cli = ["py.typed", "profile_spec.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# The same two roots pytest puts on the path below, so the checker sees the library's
# real types instead of treating every import from it as Unknown.
extraPaths = ["src", "../../lib/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The library root is named explicitly rather than left to an install: this package is
# tested against the tree beside it, and a "." entry here would put the package
# directory itself on the path ahead of src/.
pythonpath = ["src", "../../lib/src"]
testpaths = ["tests/unit"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
